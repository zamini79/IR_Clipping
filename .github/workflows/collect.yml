name: collect
on:
  # Scheduling moved to cron-job.org (hourly, on the minute). GitHub's scheduler
  # skipped hours at a time — 09:02 → 13:28 on 2026-07-26 — which delayed
  # collection by that much. This workflow stays for manual runs, where ?wait=1
  # reports the pipeline's actual result.
  workflow_dispatch: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collect endpoint
        run: |
          # URL is a public endpoint (not sensitive); hardcoded so a missing
          # APP_COLLECT_URL secret can't leave curl with an empty URL (exit 3).
          # A secret, if set, overrides.
          # wait=1 runs the pipeline synchronously and returns its result, so a
          # failure shows up here. (The external cron calls the URL without it
          # and gets an immediate 202 instead.)
          url="${APP_COLLECT_URL:-https://ir-clipping.vercel.app/api/collect}?wait=1"
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 290 -X POST "$url" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
        env:
          APP_COLLECT_URL: ${{ secrets.APP_COLLECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
