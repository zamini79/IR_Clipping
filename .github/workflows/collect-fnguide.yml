name: collect-fnguide
on:
  # Scheduling moved to cron-job.org (daily 04:00 KST — FnGuide login
  # force-logs-out the user's own session, so it runs at night). Kept here for
  # manual runs.
  workflow_dispatch: {}
jobs:
  collect-fnguide:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FnGuide collect endpoint
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 290 -X POST \
            "https://ir-clipping.vercel.app/api/collect-fnguide?wait=1" -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
